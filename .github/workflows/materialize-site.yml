name: Validate website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci
      - name: Build production pages
        run: |
          python3 - <<'PY'
          import json, shlex, subprocess
          from pathlib import Path
          for command in json.loads(Path('vercel.json').read_text())['buildCommand'].split(' && '):
              subprocess.run(shlex.split(command), check=True)
          PY
      - name: Test API and catalogue behaviour
        run: node --test tests/*.test.mjs
      - name: Validate public sitemap
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          urls = [node.text for node in ET.parse("sitemap.xml").findall(".//{*}loc")]
          assert "https://www.automation-outlet.co.uk/" in urls
          assert "https://www.automation-outlet.co.uk/buy-stock.html" in urls
          assert not any("stock-admin" in url or "deal-desk" in url for url in urls)
          PY
