name: Validate website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci
      - name: Build production pages
        run: |
          python3 - <<'PY'
          import json, shlex, subprocess
          from pathlib import Path
          for command in json.loads(Path('vercel.json').read_text())['buildCommand'].split(' && '):
              subprocess.run(shlex.split(command), check=True)
          PY
      - name: Validate browser JavaScript syntax
        run: |
          node --check agent-desk.js
          node --check deal-desk.js
          node --check stock-admin.js
          node --check stock-import.js
          node --check plc-audit.js
          node --check api/plc-audit.mjs
          node --check lib/plc-audit-auth.mjs
          node --check lib/plc-audit-blob.mjs
          node --check lib/plc-audit-model.mjs
          node --check lib/plc-audit-service.mjs
          node --check lib/plc-audit-store.mjs
      - name: Test API and catalogue behaviour
        run: node --test tests/*.test.mjs
      - name: Validate public sitemap and private-page indexing
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          urls = [node.text for node in ET.parse("sitemap.xml").findall(".//{*}loc")]
          assert "https://www.automation-outlet.co.uk/" in urls
          assert "https://www.automation-outlet.co.uk/buy-stock.html" in urls
          assert "https://www.automation-outlet.co.uk/plc-audit" in urls
          assert "https://www.automation-outlet.co.uk/plc-audit.html" not in urls

          private_pages = {
              "agent-desk.html",
              "deal-desk.html",
              "plc-audit-upload.html",
              "plc-audit-dashboard.html",
              "plc-audit-audit.html",
          }
          private_pages.update(path.name for path in Path(".").glob("*-admin.html"))

          for page in sorted(private_pages):
              url = f"https://www.automation-outlet.co.uk/{page}"
              assert url not in urls, f"Private page leaked into sitemap: {page}"
              html = Path(page).read_text(encoding="utf-8")
              assert re.search(
                  r'<meta\s+name=["\']robots["\'][^>]*noindex[^>]*>',
                  html,
                  flags=re.I,
              ), f"Private page is missing noindex: {page}"
          PY
