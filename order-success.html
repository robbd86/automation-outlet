<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stripe Sandbox Order | Automation Outlet</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.success{min-height:70vh;display:grid;place-items:center;padding:2rem 0}.success-card{max-width:720px;background:linear-gradient(180deg,var(--navy-card),#0b1b35);border:1px solid var(--line);border-radius:16px;padding:clamp(1.3rem,4vw,2.4rem);box-shadow:0 24px 70px rgba(0,0,0,.22)}.success-badge{display:inline-flex;align-items:center;gap:.45rem;border:1px solid rgba(107,226,153,.3);border-radius:999px;padding:.42rem .72rem;color:#8fe3b1;font:500 .78rem 'IBM Plex Mono';margin-bottom:1rem}.success h1{font-size:clamp(2.3rem,7vw,4.2rem);line-height:.98}.success p{color:var(--grey);line-height:1.65;margin-top:1rem}.session{font:500 .74rem 'IBM Plex Mono';overflow-wrap:anywhere;color:var(--blue-bright);margin-top:1rem}.actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.4rem}
</style>
</head>
<body>
<header><div class="wrap nav"><a href="/" class="logo logo-image"><img src="/ao-site-logo.svg" width="280" height="59" alt="Automation Outlet"></a></div></header>
<main class="success"><div class="wrap"><section class="success-card">
<div class="success-badge" id="badge">Stripe sandbox return</div>
<h1 id="heading">Verifying test payment…</h1>
<p id="message">Automation Outlet is checking this Checkout Session directly with Stripe before confirming the result.</p>
<p id="detail">This is a sandbox flow only: no real money is taken and no live stock will be fulfilled.</p>
<div class="session" id="session"></div>
<div class="actions"><a class="btn" href="/buy-stock.html">Continue shopping</a><a class="btn ghost" href="/cart.html?stripe_test=1">Back to test basket</a></div>
</section></div></main>
<script>
const p=new URLSearchParams(location.search),id=p.get("session_id");
const badge=document.getElementById("badge"),heading=document.getElementById("heading"),message=document.getElementById("message"),detail=document.getElementById("detail"),session=document.getElementById("session");
if(id) session.textContent="Sandbox session: "+id;
(async()=>{
 if(!id){heading.textContent="Payment could not be verified";message.textContent="No Stripe Checkout Session was supplied.";return;}
 try{
  const response=await fetch("/api/verify-checkout-session?session_id="+encodeURIComponent(id),{headers:{Accept:"application/json"}});
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data.paid) throw new Error(data.error||"Stripe has not marked this payment as paid.");
  badge.textContent="✓ Stripe payment verified";
  heading.textContent="Test payment completed";
  const amount=new Intl.NumberFormat("en-GB",{style:"currency",currency:String(data.currency||"GBP").toUpperCase()}).format((Number(data.amountTotal)||0)/100);
  message.textContent="Stripe has confirmed the sandbox payment as paid. Test order total: "+amount+".";
  detail.textContent="The checkout and server-side payment verification are working. The next commissioning step is a signed Stripe webhook before live orders can reduce stock automatically.";
  try{localStorage.removeItem("aoCartV1");}catch{}
 }catch(error){
  badge.textContent="Payment verification pending";
  heading.textContent="Payment not yet verified";
  message.textContent=error.message||"Automation Outlet could not verify this Stripe payment.";
  detail.textContent="Your basket has been left unchanged. This sandbox page will not treat the order as paid unless Stripe confirms it server-side.";
 }
})();
</script>
</body>
</html>
